<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Astrolabe Outer Alignment Rings -->
  <circle cx="32" cy="32" r="30" stroke="#D4C4B5" stroke-width="1.2" stroke-dasharray="2 3" stroke-opacity="0.35"/>
  <circle cx="32" cy="32" r="27" stroke="#D4C4B5" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="32" cy="32" r="25.5" stroke="#D4C4B5" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Vertical Celestial Meridian Division -->
  <line x1="32" y1="11" x2="32" y2="52" stroke="#D4C4B5" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- RIGHT HEMISPHERE: Serene Classical Sculpted Profile -->
  <path d="M32 11 C41 11 48 16 48 23 C48 27.5 45.5 30 45.5 32 C45.5 35 48.5 37 48.5 39 C48.5 40.5 46 41.5 46 43 C46 44.5 47.5 46 45 48 C42 50.5 37 52 32 52" 
        stroke="#D4C4B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brow and Eye -->
  <path d="M36 25 C39 23.5 43 24 44 26" stroke="#D4C4B5" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="40" cy="28" r="1.6" fill="#F1E0D0"/>
  <!-- Lips & Chin Accent -->
  <path d="M38 41 C40.5 41 42 40.5 43 40" stroke="#D4C4B5" stroke-width="1.4" stroke-linecap="round"/>

  <!-- LEFT HEMISPHERE: Precision Interlocking Clockwork Cogs -->
  <!-- Master Gear Cog Profile -->
  <circle cx="23" cy="32" r="6" stroke="#D4C4B5" stroke-width="1.8" stroke-dasharray="3 2" fill="none"/>
  <circle cx="23" cy="32" r="2.2" fill="#D4C4B5"/>
  <!-- Secondary Lower Gear -->
  <circle cx="27" cy="43" r="4.5" stroke="#D4C4B5" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <circle cx="27" cy="43" r="1.5" fill="#D4C4B5"/>
  <!-- Structural Armature Spoke Lines -->
  <line x1="32" y1="21" x2="26" y2="21" stroke="#D4C4B5" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="26" x2="23" y2="26" stroke="#D4C4B5" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="25" y2="38" stroke="#D4C4B5" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="28" y2="47" stroke="#D4C4B5" stroke-width="1.8" stroke-linecap="round"/>

  <!-- FOREHEAD: Saturn Planetary Orbit -->
  <circle cx="30" cy="18" r="2.5" fill="#F1E0D0"/>
  <ellipse cx="30" cy="18" rx="8" ry="3" transform="rotate(-25 30 18)" stroke="#D4C4B5" stroke-width="1.6" fill="none"/>
</svg>
